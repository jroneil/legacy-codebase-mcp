name: legacy-codebase-mcp

# Local product path: cp .env.example .env, set POSTGRES_PASSWORD, then run
# ./run-local.sh [repository]. The launcher supplies one physical host directory.

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legacy}
      POSTGRES_USER: ${POSTGRES_USER:-legacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legacy} -d ${POSTGRES_DB:-legacy}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # PostgreSQL is internal-only. docker-compose.dev.yml adds a loopback port
    # solely for a backend process running natively on the host.
    restart: unless-stopped

  backend:
    build:
      context: ./backend/legacy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-legacy}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-legacy}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # The backend knows only the fixed container path and a safe display name.
      LEGACY_REPOSITORY_ROOT: /workspace/target
      LEGACY_REPOSITORY_NAME: ${LEGACY_REPOSITORY_NAME:-Repository not selected}
      LEGACY_REPOSITORY_CONFIGURED: ${LEGACY_REPOSITORY_CONFIGURED:-false}
      ANALYZER_VERSION: ${ANALYZER_VERSION:-grails-index-5}
    volumes:
      - type: bind
        source: ${LEGACY_REPOSITORY_ROOT:-./.local-repository-unselected}
        target: /workspace/target
        read_only: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/legacy-ui
    environment:
      LEGACY_API_BASE_URL: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
