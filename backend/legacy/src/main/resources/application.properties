spring.application.name=legacy
server.address=127.0.0.1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
# Standard SPRING_DATASOURCE_URL/USERNAME/PASSWORD supply database credentials.
legacy.scan.repository-root=${LEGACY_REPOSITORY_ROOT:}
legacy.scan.analyzer-version=${ANALYZER_VERSION:java-symbol-index-2}
