spring.application.name=legacy
server.address=127.0.0.1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
# Standard SPRING_DATASOURCE_URL/USERNAME/PASSWORD supply database credentials.
legacy.scan.repository-root=${LEGACY_REPOSITORY_ROOT:}
legacy.scan.repository-name=${LEGACY_REPOSITORY_NAME:}
legacy.scan.repository-configured=${LEGACY_REPOSITORY_CONFIGURED:false}
legacy.scan.analyzer-version=${ANALYZER_VERSION:grails-index-5}
# Slice 6 MCP server. The protocol must be set explicitly: the streamable auto-configuration is
# gated on spring.ai.mcp.server.protocol=STREAMABLE and would otherwise fall back to legacy SSE.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=legacy-codebase-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.instructions=Deterministic code intelligence for the active completed scan of a legacy Struts/Spring repository. All tools are read-only, bounded, and return evidence with scan freshness metadata.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Slice 6 exposes deterministic tools only; do not advertise unused capability families.
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.completion=false
